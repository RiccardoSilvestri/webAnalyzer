name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite, which this project depends on, landed in 23.4.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.x']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The unit tests never launch a browser, so skip the postinstall that
      # downloads Chromium; it costs minutes and buys nothing here.
      - run: npm ci --ignore-scripts

      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
